services:
  simulator:
    build:
      context: .
      dockerfile: Dockerfile
    image: purview-policy-simulator:latest
    container_name: purview-simulator
    ports:
      - "8000:8000"
    environment:
      - CORS_ORIGINS=*
      # Uncomment and set to restrict origins in production:
      # - CORS_ORIGINS=https://your-domain.com
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
